<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: #000; overflow: hidden; }</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
// Dato curioso 3D: ondas gravitacionales. Una malla neón (el espacio-tiempo) sobre fondo negro, hundida por
// dos agujeros negros que giran en espiral cada vez más rápido; sus ondas salen en espiral por la malla.
// Al chocar (clímax): destello, onda expansiva, partículas, aberración de color y la malla ondeando.
// Los tiempos de la espiral, los textos y el audio salen de ondas.py (window.cargar(datos)); grabar.js llama
// a window.dibujar(t) para cada cuadro.
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const W = 1080, H = 1920;
const LADO = 46, LINEAS = 115, PUNTOS = 420;   // malla: tamaño, líneas por dirección, puntos por línea
const C = 6.5;                                 // velocidad de las ondas (unidades por segundo)
const G = 1.35, SUAVE = 0.55;                  // hondura de los pozos

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

const escena = new THREE.Scene();
escena.background = new THREE.Color(0x000000);
const camara = new THREE.PerspectiveCamera(58, W / H, 0.1, 500);

let semilla = 11;
const azar = () => (semilla = (semilla * 16807) % 2147483647) / 2147483647;
const suave = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };

// Espiral (mismas fórmulas que ondas.py)
let P = null;
const omega = (t) => P.w0 * Math.pow(P.tc / Math.max(P.tc - t, P.tauMin), 0.375);
function fase(t) {
  const tau = Math.max(P.tc - t, P.tauMin);
  const K = P.w0 * Math.pow(P.tc, 0.375);
  let f = 1.6 * K * (Math.pow(P.tc, 0.625) - Math.pow(tau, 0.625));
  if (t > P.tChoque) f += omega(P.tChoque) * (t - P.tChoque);
  return f;
}
const separacion = (t) => P.a0 * Math.pow(Math.max(P.tc - t, P.tauMin) / P.tc, 0.25);

// ------------------------------------------------------------------ estrellas
{
  const n = 3000, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const u = azar() * 2 - 1, a = azar() * Math.PI * 2, r = 150 + azar() * 60;
    const s = Math.sqrt(1 - u * u);
    pos.set([Math.cos(a) * s * r, Math.abs(u) * r * 0.9 + 5, Math.sin(a) * s * r], i * 3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  escena.add(new THREE.Points(geo, new THREE.PointsMaterial({ color: 0x8f86c8, size: 1.5, sizeAttenuation: false })));
}

// ------------------------------------------------------------------ la malla del espacio-tiempo
const uMalla = {
  t: { value: 0 }, p1: { value: new THREE.Vector2() }, p2: { value: new THREE.Vector2() },
  tc: { value: 0 }, tChoque: { value: 0 }, tauMin: { value: 0 }, w0: { value: 0 },
  repAmp: { value: 0 }, repFase: { value: 0 },     // ondas de la repetición del chirp
};
{
  const pos = new Float32Array(2 * LINEAS * PUNTOS * 3);
  const idx = [];
  let v = 0;
  for (let dir = 0; dir < 2; dir++) {
    for (let i = 0; i < LINEAS; i++) {
      const fijo = -LADO / 2 + LADO * i / (LINEAS - 1);
      for (let j = 0; j < PUNTOS; j++) {
        const corre = -LADO / 2 + LADO * j / (PUNTOS - 1);
        pos.set(dir === 0 ? [corre, 0, fijo] : [fijo, 0, corre], v * 3);
        if (j > 0) idx.push(v - 1, v);
        v++;
      }
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setIndex(idx);
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), LADO);
  const malla = new THREE.LineSegments(geo, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: uMalla,
    vertexShader: `
      uniform float t, tc, tChoque, tauMin, w0, repAmp, repFase;
      uniform vec2 p1, p2;
      varying vec3 vColor;
      varying float vAlfa;
      float fase(float tt) {
        float tau = max(tc - tt, tauMin);
        float K = w0 * pow(tc, 0.375);
        float f = 1.6 * K * (pow(tc, 0.625) - pow(tau, 0.625));
        if (tt > tChoque) f += w0 * pow(tc / tauMin, 0.375) * (tt - tChoque);
        return f;
      }
      float pozo(vec2 p) {
        if (t < tChoque) {
          return -${G.toFixed(2)} / sqrt(dot(p - p1, p - p1) + ${SUAVE.toFixed(2)})
                 -${G.toFixed(2)} / sqrt(dot(p - p2, p - p2) + ${SUAVE.toFixed(2)});
        }
        return -${(G * 1.9).toFixed(2)} / sqrt(dot(p, p) + ${(SUAVE * 1.4).toFixed(2)});
      }
      void main() {
        vec2 p = position.xz;
        float r = length(p);
        float th = atan(p.y, p.x);
        float tr = t - r / ${C.toFixed(1)};             // tiempo en que salió la onda que llega aquí
        float lejos = 1.0 / sqrt(1.0 + 0.22 * r);
        float cerca = smoothstep(0.6, 3.2, r);
        float h = 0.0;
        if (tr < tChoque) {
          float w = w0 * pow(tc / max(tc - tr, tauMin), 0.375);
          float amp = 0.11 * pow(w / w0, 0.9);
          h = amp * cos(2.0 * th - 2.0 * fase(tr)) * lejos * cerca;
        } else {
          float dt = tr - tChoque;
          float ring = 0.75 * cos(2.0 * th - 2.0 * fase(tr)) * exp(-dt * 2.6);
          float pulso = 1.7 * sin(dt * 10.0) * exp(-dt * 3.2);
          float eco = 0.4 * sin(dt * 7.0) * exp(-dt * 0.3);     // la malla se queda ondeando
          h = (ring + pulso + eco) * lejos * cerca;
        }
        h += 0.06 * sin(r * 0.9 - t * 1.6) * lejos;           // respiración suave de fondo
        h += repAmp * sin(r * 1.3 - repFase) * lejos * cerca;
        vec3 q = vec3(p.x, pozo(p) + h, p.y);
        vec4 mv = modelViewMatrix * vec4(q, 1.0);
        gl_Position = projectionMatrix * mv;
        // Color: cian ↔ magenta que gira despacio; las crestas se encienden hacia blanco
        float mezcla = 0.5 + 0.5 * sin(th + r * 0.18 - t * 0.5);
        vec3 c = mix(vec3(0.0, 0.85, 1.0), vec3(1.0, 0.2, 0.85), mezcla);
        float cresta = clamp(abs(h) * 2.2, 0.0, 1.0);
        c = mix(c, vec3(1.0, 0.95, 1.0), cresta * 0.55);
        float hondo = clamp(-pozo(p) * 0.35, 0.0, 1.0);
        vColor = c * (0.22 + 0.9 * cresta + 0.35 * hondo);
        vAlfa = smoothstep(${(LADO / 2).toFixed(1)}, 6.0, r) * smoothstep(60.0, 8.0, -mv.z);
      }`,
    fragmentShader: `
      varying vec3 vColor;
      varying float vAlfa;
      void main() { gl_FragColor = vec4(vColor * vAlfa, 1.0); }`,
  }));
  escena.add(malla);
}
const pozoJS = (x, z, t) => {
  if (t < P.tChoque) {
    const a = separacion(t), f = fase(t);
    const x1 = Math.cos(f) * a / 2, z1 = Math.sin(f) * a / 2;
    return -G / Math.sqrt((x - x1) ** 2 + (z - z1) ** 2 + SUAVE) - G / Math.sqrt((x + x1) ** 2 + (z + z1) ** 2 + SUAVE);
  }
  return -G * 1.9 / Math.sqrt(x * x + z * z + SUAVE * 1.4);
};

// ------------------------------------------------------------------ agujeros negros
const materialAnillo = (color) => new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { color: { value: new THREE.Color(color) }, brillo: { value: 1 } },
  vertexShader: 'varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform vec3 color; uniform float brillo; varying vec2 vP;
    void main(){
      float r = length(vP);
      float b = exp(-pow((r - 1.04) * 16.0, 2.0)) + 0.35 * exp(-pow((r - 1.2) * 5.0, 2.0));
      gl_FragColor = vec4(color * b * brillo, 1.0);
    }`,
});
function agujero(color, radio) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(1, 48, 24), new THREE.MeshBasicMaterial({ color: 0x000000 })));
  const anillo = new THREE.Mesh(new THREE.RingGeometry(0.9, 1.8, 96), materialAnillo(color));
  g.add(anillo);
  g.scale.setScalar(radio);
  escena.add(g);
  return { g, anillo };
}
const bh1 = agujero(0x22e8ff, 0.42), bh2 = agujero(0xff3ad6, 0.42), bhF = agujero(0xd9b8ff, 0.62);

// Estelas: las últimas posiciones de cada agujero (se calculan con la fórmula, sin guardar estado)
const ESTELA = 140;
function estela(color) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(ESTELA * 3), 3));
  const col = new Float32Array(ESTELA * 3);
  const c = new THREE.Color(color);
  for (let i = 0; i < ESTELA; i++) {
    const k = Math.pow(1 - i / ESTELA, 2);
    col.set([c.r * k, c.g * k, c.b * k], i * 3);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const linea = new THREE.Line(geo, new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  linea.frustumCulled = false;
  escena.add(linea);
  return linea;
}
const estela1 = estela(0x22e8ff), estela2 = estela(0xff3ad6);

// ------------------------------------------------------------------ choque: onda expansiva y chispas
const onda = new THREE.Mesh(new THREE.RingGeometry(0.97, 1.0, 256), new THREE.MeshBasicMaterial({
  color: 0xffffff, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }));
onda.rotation.x = -Math.PI / 2;
escena.add(onda);

const CHISPAS = 5000;
const uChispas = { t: { value: 0 }, tChoque: { value: 0 } };
{
  const dir = new Float32Array(CHISPAS * 3), vel = new Float32Array(CHISPAS), tono = new Float32Array(CHISPAS);
  for (let i = 0; i < CHISPAS; i++) {
    const a = azar() * Math.PI * 2, u = (azar() * 2 - 1) * 0.35;
    const s = Math.sqrt(1 - u * u);
    dir.set([Math.cos(a) * s, u + 0.15, Math.sin(a) * s], i * 3);
    vel[i] = 2 + Math.pow(azar(), 0.6) * 11;
    tono[i] = azar();
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(dir, 3));
  geo.setAttribute('vel', new THREE.BufferAttribute(vel, 1));
  geo.setAttribute('tono', new THREE.BufferAttribute(tono, 1));
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 100);
  escena.add(new THREE.Points(geo, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: uChispas,
    vertexShader: `uniform float t, tChoque; attribute float vel, tono; varying vec3 vColor;
      void main(){
        float dt = max(t - tChoque, 0.0);
        float d = vel * (1.0 - exp(-dt * 1.6)) / 1.6 * 1.6;     // frenan poco a poco
        vec3 p = position * d + vec3(0.0, -1.2, 0.0);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        float vida = t < tChoque ? 0.0 : exp(-dt * 0.9);
        gl_PointSize = clamp(60.0 / -mv.z, 1.0, 5.0);
        vColor = mix(vec3(0.1, 0.9, 1.0), vec3(1.0, 0.25, 0.85), tono) * vida * 0.9;
      }`,
    fragmentShader: `varying vec3 vColor;
      void main(){ float d = length(gl_PointCoord - 0.5); if (d > 0.5) discard;
        gl_FragColor = vec4(vColor * smoothstep(0.5, 0.0, d), 1.0); }`,
  })));
}

// ------------------------------------------------------------------ posproceso: brillo + aberración de color
const compositor = new EffectComposer(renderer);
compositor.addPass(new RenderPass(escena, camara));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.7, 0.45, 0.12);
compositor.addPass(bloom);
const aberracion = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, fuerza: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float fuerza; varying vec2 vUv;
    void main(){
      vec2 d = (vUv - 0.5) * fuerza;
      gl_FragColor = vec4(texture2D(tDiffuse, vUv + d).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - d).b, 1.0);
    }`,
});
compositor.addPass(aberracion);
compositor.addPass(new OutputPass());

// ------------------------------------------------------------------ capas de texto (Pillow, modo "screen")
const hud = new THREE.Scene();
const camaraHud = new THREE.OrthographicCamera(-0.5, 0.5, 0.5, -0.5, 0, 1);
const planoHud = new THREE.PlaneGeometry(1, 1);
function capaScreen(textura, orden = 2) {
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthTest: false, depthWrite: false,
    blending: THREE.CustomBlending, blendEquation: THREE.AddEquation,
    blendSrc: THREE.OneMinusDstColorFactor, blendDst: THREE.OneFactor,
    uniforms: { mapa: { value: textura }, fuerza: { value: 0 }, escala: { value: 1 }, centro: { value: new THREE.Vector2(0.5, 0.5) } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy * 2.0, 0.0, 1.0); }',
    fragmentShader: `uniform sampler2D mapa; uniform float fuerza, escala; uniform vec2 centro; varying vec2 vUv;
      void main(){ vec2 uv = centro + (vUv - centro) / escala;
        vec3 c = (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) ? vec3(0.0) : texture2D(mapa, uv).rgb;
        gl_FragColor = vec4(c * fuerza, 1.0); }`,
  });
  const malla = new THREE.Mesh(planoHud, mat);
  malla.renderOrder = orden;
  hud.add(malla);
  return malla;
}
function capaColor(color, orden) {
  const malla = new THREE.Mesh(planoHud, new THREE.ShaderMaterial({
    transparent: true, depthTest: false, depthWrite: false,
    uniforms: { color: { value: new THREE.Color(color) }, opacidad: { value: 0 } },
    vertexShader: 'void main(){ gl_Position = vec4(position.xy * 2.0, 0.0, 1.0); }',
    fragmentShader: 'uniform vec3 color; uniform float opacidad; void main(){ gl_FragColor = vec4(color, opacidad); }',
  }));
  malla.renderOrder = orden;
  hud.add(malla);
  return malla;
}
let capas = [], marca = null, velo = null, cierre = null, choque = null, destello = null, fundido = null;
const entraSale = (t, t0, t1, d = 0.35) => suave((t - t0) / d) * suave((t1 - t) / d);

async function cargarCapas(c) {
  const cargador = new THREE.TextureLoader();
  const textura = async (url) => {
    const tx = await cargador.loadAsync(url);
    tx.colorSpace = THREE.NoColorSpace;
    tx.minFilter = THREE.LinearFilter;
    tx.generateMipmaps = false;
    return tx;
  };
  capas.push({ malla: capaScreen(await textura(c.titulo.img)), ...c.titulo });
  for (const x of c.textos) capas.push({ malla: capaScreen(await textura(x.img)), ...x });
  choque = { malla: capaScreen(await textura(c.choque.img), 6), ...c.choque };
  choque.malla.material.uniforms.centro.value.set(0.5, 1 - 560 / H);
  marca = capaScreen(await textura(c.marca));
  velo = capaColor(0x000000, 3);
  cierre = capaScreen(await textura(c.cierre), 4);
}
destello = capaColor(0xffffff, 5);
fundido = capaColor(0x000000, 7);

// ------------------------------------------------------------------ cuadro
let total = 0;
const tmp = new THREE.Vector3();

window.dibujar = (t) => {
  const tC = P.tChoque, dtC = t - tC;
  for (const u of [uMalla]) u.t.value = t;
  uChispas.t.value = t;

  // Agujeros: giran en espiral; al chocar queda uno solo, más grande
  const antes = t < tC;
  const posicion = (tt, signo) => {
    const a = separacion(tt) / 2, f = fase(tt);
    const x = signo * Math.cos(f) * a, z = signo * Math.sin(f) * a;
    return [x, pozoJS(x, z, Math.min(tt, tC - 1e-3)) + 0.3, z];
  };
  const [x1, y1, z1] = posicion(t, 1), [x2, y2, z2] = posicion(t, -1);
  uMalla.p1.value.set(x1, z1);
  uMalla.p2.value.set(x2, z2);
  bh1.g.visible = bh2.g.visible = antes;
  bhF.g.visible = !antes;
  bh1.g.position.set(x1, y1, z1);
  bh2.g.position.set(x2, y2, z2);
  bhF.g.position.set(0, pozoJS(0, 0, t) + 0.5, 0);
  for (const b of [bh1, bh2, bhF]) b.anillo.lookAt(camara.position);
  const acelera = Math.min(1, (omega(Math.min(t, tC)) / P.w0 - 1) / 7);
  bh1.anillo.material.uniforms.brillo.value = bh2.anillo.material.uniforms.brillo.value = 0.7 + 0.8 * acelera;
  // Después del choque el agujero nuevo late; en la repetición del chirp late con el tono
  const [tr, dr] = P.repeticion;
  let latido = 1.2 + 2.5 * Math.exp(-Math.max(dtC, 0) * 2);
  if (t > tr && t < tr + dr + 0.4) {
    const k = Math.min(1, (t - tr) / dr);
    latido += 1.2 * k * k * (0.5 + 0.5 * Math.sin((t - tr) * (6 + 60 * k * k)));
  }
  bhF.anillo.material.uniforms.brillo.value = latido;
  // La repetición del chirp también sale en la malla: ondas que se apuran y crecen con el tono
  const kr = Math.min(1, Math.max(0, (t - tr) / dr));
  uMalla.repAmp.value = t > tr ? 0.9 * kr * kr * Math.exp(-Math.max(0, t - tr - dr) * 3) : 0;
  uMalla.repFase.value = t > tr ? 2 * Math.PI * (2 * (t - tr) + 10 * Math.pow(Math.min(t - tr, dr), 3) / (dr * dr)) : 0;

  for (const [linea, signo] of [[estela1, 1], [estela2, -1]]) {
    linea.visible = antes;
    const pos = linea.geometry.attributes.position;
    for (let i = 0; i < ESTELA; i++) {
      const p = posicion(Math.max(0, t - i * 0.012), signo);
      pos.setXYZ(i, p[0], p[1], p[2]);
    }
    pos.needsUpdate = true;
  }

  // Onda expansiva del choque
  onda.visible = dtC > 0 && dtC < 4;
  if (onda.visible) {
    const r = 0.5 + dtC * C;
    onda.scale.setScalar(r);
    onda.position.y = 0.4;
    onda.material.opacity = Math.exp(-dtC * 1.1);
  }

  // Cámara: se acerca mientras se aceleran, sacudida en el choque y luego se aleja para ver las ondas
  const ida = suave(t / tC), vuelta = suave((t - tC - 0.3) / 6);
  const dist = 16 - 6.5 * ida + 10 * vuelta;
  const alto = 9.5 - 3.5 * ida + 7.5 * vuelta;
  const giro = 0.6 + 0.07 * t + 0.25 * suave(t / tC);
  camara.position.set(Math.sin(giro) * dist, alto, Math.cos(giro) * dist);
  if (dtC > 0 && dtC < 1.2) {
    const s = 0.35 * Math.exp(-dtC * 4);
    camara.position.x += s * Math.sin(t * 91);
    camara.position.y += s * Math.sin(t * 77 + 1);
  }
  camara.lookAt(0, -1.2 - 0.5 * vuelta, 0);

  // Brillo y aberración: suben con la espiral y explotan en el choque
  const golpe = dtC > 0 ? Math.exp(-dtC * 2.2) : 0;
  bloom.strength = 0.7 + 0.5 * acelera * (antes ? 1 : 0) + 1.6 * golpe;
  aberracion.uniforms.fuerza.value = 0.004 + 0.008 * acelera * (antes ? 1 : 0) + 0.035 * golpe;

  renderer.clear();
  compositor.render();

  // Textos
  for (const c of capas) c.malla.material.uniforms.fuerza.value = entraSale(t, c.t0, c.t1);
  if (choque) {
    const k = dtC > 0 ? suave(dtC / 0.12) : 0;
    choque.malla.material.uniforms.fuerza.value = k * suave((choque.t1 - t) / 0.4);
    choque.malla.material.uniforms.escala.value = 0.6 + 0.4 * (1 - Math.pow(1 - Math.min(1, dtC / 0.25), 3))
      + 0.02 * Math.max(0, dtC);
  }
  const kc = suave((t - P.cierre) / 0.8);
  if (marca) marca.material.uniforms.fuerza.value = 1 - kc;
  if (velo) velo.material.uniforms.opacidad.value = 0.7 * kc;
  if (cierre) cierre.material.uniforms.fuerza.value = kc;
  destello.material.uniforms.opacidad.value = dtC > 0 ? 0.9 * Math.exp(-dtC * 5) : 0;
  fundido.material.uniforms.opacidad.value = t < 0.3 ? 1 - t / 0.3 : (t > total - 0.6 ? (t - (total - 0.6)) / 0.6 : 0);
  renderer.render(hud, camaraHud);
};

window.cargar = async (datos) => {
  P = datos;
  total = datos.total;
  uMalla.tc.value = datos.tc;
  uMalla.tChoque.value = datos.tChoque;
  uMalla.tauMin.value = datos.tauMin;
  uMalla.w0.value = datos.w0;
  uChispas.tChoque.value = datos.tChoque;
  await cargarCapas(datos.capas);
};
window.listo = true;
