<html>

<script type="importmap">

<body>
<script type="module">
// "¿Por qué tu techno no rueda?" (ADR-022): secuenciador 3D de 16 pasos × 6 carriles que se llena capa por
// capa sobre el sol retro y el piso synthwave. Cada bloque que suena salta, se prende y suelta un anillo y
// chispas. En el drop la cuadrícula se enrolla en un cilindro que gira al tempo ("rueda"), glitch y cierre NK.
// Los golpes, textos y tiempos vienen de techno.py (los mismos que el audio). grabar.js llama a
// window.cargar(datos) y luego a window.dibujar(t); todo sale de t, así una vista previa = el video.
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const W = 1080, H = 1920;
const PASOS = 16, FILAS = 6;
const RADIO = PASOS / (2 * Math.PI);    // radio del cilindro del drop (la cuadrícula da una vuelta exacta)
const ALTO_BALDOSA = 0.18, TOPE = ALTO_BALDOSA / 2;
// Color y altura de cada capa (graves magenta, agudos cian, acentos morado y amarillo; MOTION.md)
const CAPAS = {
  'KICK': { color: 0xff32d2, alto: 1.6 },
  'GHOST': { color: 0xff32d2, alto: 1.6 },
  'RUMBLE': { color: 0xb02393, alto: 0.85 },
  'CLAP': { color: 0xaa64ff, alto: 1.2 },
  'STAB': { color: 0xffe146, alto: 1.9 },
  'OPEN HAT': { color: 0x8ff8ff, alto: 0.7 },
  'HATS': { color: 0x00f0ff, alto: 0.42 },
  'ROLL': { color: 0xaa64ff, alto: 1.1 },       // redoble de clap en la subida
};
// Carril que se resalta en cada toma
const FOCO = { gancho: ['KICK'], hueco: ['KICK', 'RUMBLE'], rumble: ['RUMBLE'], ghost: ['KICK'], clap: ['CLAP'],
  hats: ['HATS', 'OPEN HAT'], stab: ['STAB'], drop: [],
  kick: ['KICK'], sidechain: ['RUMBLE'], open: ['OPEN HAT'], swing: ['HATS', 'OPEN HAT'], antes: ['KICK'], subida: ['CLAP'] };

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

const escena = new THREE.Scene();
escena.background = new THREE.Color(0x080416);
escena.fog = new THREE.Fog(0x0d0520, 30, 110);
const camara = new THREE.PerspectiveCamera(52, W / H, 0.1, 300);

escena.add(new THREE.HemisphereLight(0xb9b4ff, 0x2a0a3a, 0.75));
const luz = new THREE.DirectionalLight(0xffffff, 1.5);
luz.position.set(-5, 10, 8);
escena.add(luz);
const contraluz = new THREE.DirectionalLight(0xff4fd8, 1.4);   // el sol pinta los bordes de magenta
contraluz.position.set(0, 3, -12);
escena.add(contraluz);

// ------------------------------------------------------------------ fondo: degradado, sol, montañas, piso
{
  const n = 900, pos = new Float32Array(n * 3);
  let s = 777;
  const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < n; i++) pos.set([(rnd() - 0.5) * 300, 15 + rnd() * 120, -120 - rnd() * 40], i * 3);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  escena.add(new THREE.Points(geo, new THREE.PointsMaterial({ color: 0x9a8cff, size: 1.4, sizeAttenuation: false, fog: false })));
}
const cielo = new THREE.Mesh(new THREE.SphereGeometry(200, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `varying vec3 vP;
    void main(){
      float y = normalize(vP).y;
      // En lineal (la salida pasa a sRGB): #080416 arriba → #1A082C en el horizonte
      vec3 arriba = vec3(0.0024, 0.0012, 0.0080), abajo = vec3(0.0103, 0.0024, 0.0252);
      gl_FragColor = vec4(mix(abajo, arriba, smoothstep(-0.05, 0.45, y)), 1.0);
    }`,
}));
escena.add(cielo);

// Sol retro de franjas (el de piano.html, más grande) que late con el kick
const sol = new THREE.Mesh(new THREE.CircleGeometry(24, 96), new THREE.ShaderMaterial({
  fog: false, uniforms: { latido: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform float latido; varying vec2 vUv;
    void main(){
      vec3 c = mix(vec3(1.0,0.1,0.6), vec3(1.0,0.5,0.22), smoothstep(0.1, 0.95, vUv.y));
      float franja = step(0.5, fract(vUv.y * 16.0)) + step(0.58, vUv.y);
      if (franja < 0.5 && vUv.y < 0.58) discard;
      gl_FragColor = vec4(c * (0.42 + 0.14 * latido), 1.0);
    }`,
}));
// Sol, montañas y piso van hundidos y en la dirección de las tomas abiertas: así quedan detrás de la
// cuadrícula y el cielo de arriba queda oscuro y limpio para el texto (como en la referencia).
const FONDO = new THREE.Vector3(0.61, 0, -0.79);
const Y_PISO = -40;
sol.position.copy(FONDO).multiplyScalar(120).setY(-32);
sol.lookAt(0, -32, 0);
escena.add(sol);

// Montañas: silueta oscura con el filo en magenta
{
  let s = 4242;
  const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  const forma = new THREE.Shape();
  const filo = [];
  forma.moveTo(-260, -5);
  for (let x = -260; x <= 260; x += 9) {
    const y = 5 + Math.abs(Math.sin(x * 0.021)) * 13 + Math.sin(x * 0.07) * 6 + rnd() * 5 - Math.abs(x) * 0.02;
    forma.lineTo(x, y);
    filo.push(new THREE.Vector3(x, y, 0));
  }
  forma.lineTo(260, -5);
  const montes = new THREE.Mesh(new THREE.ShapeGeometry(forma), new THREE.MeshBasicMaterial({ color: 0x0c0418, fog: false }));
  const linea = new THREE.Line(new THREE.BufferGeometry().setFromPoints(filo), new THREE.LineBasicMaterial({ color: 0xff32d2, fog: false }));
  linea.position.z = 0.1;
  const g = new THREE.Group();
  g.add(montes, linea);
  g.position.copy(FONDO).multiplyScalar(100).setY(Y_PISO);
  g.lookAt(0, Y_PISO, 0);
  escena.add(g);
}

// Piso synthwave (rejilla con shader, como piano.html) que avanza al tempo
const piso = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.ShaderMaterial({
  uniforms: { avance: { value: 0 }, latido: { value: 0 } },
  vertexShader: `varying vec3 vMundo;
    void main(){ vec4 m = modelMatrix * vec4(position, 1.0); vMundo = m.xyz; gl_Position = projectionMatrix * viewMatrix * m; }`,
  fragmentShader: `uniform float avance; uniform float latido; varying vec3 vMundo;
    void main(){
      vec2 c = vec2(vMundo.x, vMundo.z + avance) / 5.0;
      vec2 paso = fwidth(c);
      vec2 d = abs(fract(c - 0.5) - 0.5) / paso;
      float linea = 1.0 - smoothstep(0.6, 1.6, min(d.x, d.y));
      float lejos = 1.0 - smoothstep(0.05, 0.2, max(paso.x, paso.y));
      float niebla = 1.0 - smoothstep(40.0, 110.0, length(vMundo.xz - cameraPosition.xz));
      vec3 col = vec3(1.0, 0.16, 0.78) * (0.55 + 0.3 * latido);
      // Piso opaco (tapa la mitad de abajo del sol), del mismo color que el cielo en el horizonte
      gl_FragColor = vec4(vec3(0.0103, 0.0024, 0.0252) + col * linea * lejos * niebla, 1.0);
    }`,
}));
piso.rotation.x = -Math.PI / 2;
piso.position.y = Y_PISO;
escena.add(piso);

// ------------------------------------------------------------------ el secuenciador
// tablero: se inclina y sube en el drop. Las baldosas y bloques se colocan a mano con colocar(), que dobla la
// cuadrícula en un cilindro según m (0 = plano, 1 = cilindro) y la hace girar.
const tablero = new THREE.Group();
escena.add(tablero);

const posTmp = new THREE.Vector3(), quatTmp = new THREE.Quaternion(), ejeZ = new THREE.Vector3(0, 0, 1);
let doblez = 0, giro = 0;
function colocar(x, yl, z) {
  if (doblez < 1e-4) {
    posTmp.set(x, yl, z);
    quatTmp.identity();
  } else {
    const rb = RADIO / doblez;
    const fi = (x - giro) / rb;
    posTmp.set((rb + yl) * Math.sin(fi), (rb + yl) * Math.cos(fi) - rb, z);
    quatTmp.setFromAxisAngle(ejeZ, -fi);
  }
}
const xDePaso = p => p - (PASOS - 1) / 2;
const FILA = 1.3;                               // fondo de cada carril (más que el ancho: se leen mejor desde arriba)
const zDeFila = f => ((FILAS - 1) / 2 - f) * FILA;     // fila 0 (KICK) adelante

const matBaldosa = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.32, metalness: 0.35 });
matBaldosa.onBeforeCompile = (sh) => {
  sh.fragmentShader = sh.fragmentShader.replace('#include <emissivemap_fragment>',
    '#include <emissivemap_fragment>\n#ifdef USE_INSTANCING_COLOR\n totalEmissiveRadiance += max(vColor.rgb - vec3(0.09, 0.07, 0.13), 0.0) * 1.2;\n#endif');
};
const baldosas = new THREE.InstancedMesh(new THREE.BoxGeometry(0.92, ALTO_BALDOSA, FILA - 0.08), matBaldosa, PASOS * FILAS);
baldosas.frustumCulled = false;
tablero.add(baldosas);
// Base: un marco fino cian debajo de la cuadrícula (solo en plano)
const marco = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(PASOS + 0.1, 0.02, FILAS * FILA + 0.1)),
  new THREE.LineBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.5 }));
marco.position.y = -TOPE - 0.02;
tablero.add(marco);

const matBloque = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, metalness: 0.1 });
matBloque.onBeforeCompile = (sh) => {
  sh.fragmentShader = sh.fragmentShader.replace('#include <emissivemap_fragment>',
    '#include <emissivemap_fragment>\n#ifdef USE_INSTANCING_COLOR\n totalEmissiveRadiance += vColor.rgb * 0.42;\n#endif');
};
const MAX_BLOQUES = 80;
const bloques = new THREE.InstancedMesh(new THREE.BoxGeometry(0.78, 1, 0.78), matBloque, MAX_BLOQUES);
bloques.frustumCulled = false;
tablero.add(bloques);

// Anillos de luz que se abren en la baldosa al sonar
const MAX_ANILLOS = 60;
const geoAnillo = new THREE.RingGeometry(0.4, 0.47, 48);
geoAnillo.rotateX(-Math.PI / 2);
const anillos = new THREE.InstancedMesh(geoAnillo, new THREE.MeshBasicMaterial({
  color: 0xffffff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
}), MAX_ANILLOS);
anillos.frustumCulled = false;
tablero.add(anillos);

// Chispas (en coordenadas del mundo, tiro parabólico)
const MAX_CHISPAS = 900;
const geoChispas = new THREE.BufferGeometry();
geoChispas.setAttribute('position', new THREE.BufferAttribute(new Float32Array(MAX_CHISPAS * 3), 3));
geoChispas.setAttribute('color', new THREE.BufferAttribute(new Float32Array(MAX_CHISPAS * 3), 3));
const puntoRedondo = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(255,255,255,1)');
  r.addColorStop(0.35, 'rgba(255,255,255,0.6)');
  r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r;
  g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();
const chispas = new THREE.Points(geoChispas, new THREE.PointsMaterial({
  size: 0.16, map: puntoRedondo, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
}));
chispas.frustumCulled = false;
escena.add(chispas);

// Cabezal de reproducción: franja de luz que recorre los pasos (solo en plano)
const cabezal = new THREE.Mesh(new THREE.BoxGeometry(0.98, 0.04, FILAS * FILA + 0.3), new THREE.MeshBasicMaterial({
  color: 0x9ff9ff, transparent: true, opacity: 0.0, blending: THREE.AdditiveBlending, depthWrite: false,
}));
cabezal.position.y = TOPE + 0.03;
tablero.add(cabezal);

// ------------------------------------------------------------------ anotaciones (en el plano del tablero)
const anot = new THREE.Group();
tablero.add(anot);
const blancoLinea = (o = 1) => new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 0.12, gapSize: 0.09, transparent: true, opacity: o });

// Huecos: contorno punteado en las baldosas del RUMBLE entre kicks
const huecos = new THREE.Group();
for (const p of [1, 2, 3, 5, 6, 7, 9, 10, 11, 13, 14, 15]) {
  const x = xDePaso(p), z = zDeFila(1), r = 0.44;
  const g = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(x - r, 0, z - r), new THREE.Vector3(x + r, 0, z - r), new THREE.Vector3(x + r, 0, z + r),
    new THREE.Vector3(x - r, 0, z + r), new THREE.Vector3(x - r, 0, z - r)]);
  const l = new THREE.Line(g, blancoLinea());
  l.computeLineDistances();
  l.position.y = TOPE + 0.02;
  l.userData.paso = p;
  huecos.add(l);
}
anot.add(huecos);

// X sobre las baldosas del RUMBLE donde cae el kick ("nunca lo pisa")
const equis = [];
for (const p of [0, 4, 8, 12]) {
  const g = new THREE.Group();
  for (const a of [Math.PI / 4, -Math.PI / 4]) {
    const barra = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.03, 0.07), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true }));
    barra.rotation.y = a;
    g.add(barra);
  }
  g.position.set(xDePaso(p), TOPE + 0.06, zDeFila(1));
  g.userData.paso = p;
  equis.push(g);
  anot.add(g);
}

// Flecha curva del ghost kick al kick
const curva = new THREE.QuadraticBezierCurve3(
  new THREE.Vector3(xDePaso(11), TOPE + 0.62, zDeFila(0)),
  new THREE.Vector3((xDePaso(11) + xDePaso(12)) / 2, TOPE + 2.7, zDeFila(0)),
  new THREE.Vector3(xDePaso(12) - 0.05, TOPE + 1.95, zDeFila(0)));
const geoFlecha = new THREE.TubeGeometry(curva, 60, 0.035, 8, false);
const flecha = new THREE.Mesh(geoFlecha, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true }));
const punta = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.26, 16), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true }));
{
  const fin = curva.getPoint(1), tan = curva.getTangent(1);
  punta.position.copy(fin);
  punta.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tan);
}
anot.add(flecha, punta);

// Líneas punteadas de los contratiempos (open hat)
const contras = new THREE.Group();
for (const p of [2, 6, 10, 14]) {
  const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(xDePaso(p), 0, zDeFila(0) + 0.6), new THREE.Vector3(xDePaso(p), 0, zDeFila(5) - 0.6)]);
  const l = new THREE.Line(g, blancoLinea());
  l.computeLineDistances();
  l.position.y = TOPE + 0.03;
  contras.add(l);
}
anot.add(contras);

// Swing: contorno punteado donde caían los contratiempos antes de atrasarlos
const sinSwing = new THREE.Group();
for (const p of [1, 3, 5, 7, 9, 11, 13, 15]) {
  const x = xDePaso(p), z = zDeFila(5), r = 0.36;
  const g = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(x - r, 0, z - r), new THREE.Vector3(x + r, 0, z - r), new THREE.Vector3(x + r, 0, z + r),
    new THREE.Vector3(x - r, 0, z + r), new THREE.Vector3(x - r, 0, z - r)]);
  const l = new THREE.Line(g, blancoLinea());
  l.computeLineDistances();
  l.position.y = TOPE + 0.02;
  sinSwing.add(l);
}
anot.add(sinSwing);

// Círculo alrededor del stab
const puntosCirculo = [];
for (let i = 0; i <= 96; i++) {
  const a = Math.PI / 2 + (i / 96) * Math.PI * 2;
  puntosCirculo.push(new THREE.Vector3(xDePaso(10) + Math.cos(a) * 0.78, 0, zDeFila(3) + Math.sin(a) * 0.78));
}
const circulo = new THREE.Line(new THREE.BufferGeometry().setFromPoints(puntosCirculo), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true }));
circulo.position.y = TOPE + 0.04;
anot.add(circulo);

// ------------------------------------------------------------------ capa 2D: textos, transporte, etiquetas, cierre
const hud = new THREE.Scene();
const camaraHud = new THREE.OrthographicCamera(-0.5, 0.5, 0.5, -0.5, 0, 1);
const lienzo = document.createElement('canvas');
lienzo.width = W;
lienzo.height = H;
const ctx = lienzo.getContext('2d');
const texHud = new THREE.CanvasTexture(lienzo);
texHud.colorSpace = THREE.NoColorSpace;
texHud.minFilter = THREE.LinearFilter;
texHud.generateMipmaps = false;
// Modo "screen": el texto se mezcla encima sin bloom propio (MOTION.md)
const capaTexto = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShaderMaterial({
  transparent: true, depthTest: false, depthWrite: false,
  blending: THREE.CustomBlending, blendEquation: THREE.AddEquation,
  blendSrc: THREE.OneMinusDstColorFactor, blendDst: THREE.OneFactor,
  uniforms: { mapa: { value: texHud } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy * 2.0, 0.0, 1.0); }',
  fragmentShader: 'uniform sampler2D mapa; varying vec2 vUv; void main(){ gl_FragColor = vec4(texture2D(mapa, vUv).rgb, 1.0); }',
}));
capaTexto.renderOrder = 3;
// Velo del cierre (debajo del texto)
const velo = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShaderMaterial({
  transparent: true, depthTest: false, depthWrite: false, uniforms: { opacidad: { value: 0 } },
  vertexShader: 'void main(){ gl_Position = vec4(position.xy * 2.0, 0.0, 1.0); }',
  fragmentShader: 'uniform float opacidad; void main(){ gl_FragColor = vec4(0.031, 0.016, 0.086, opacidad); }',
}));
velo.renderOrder = 2;
const sombra = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShaderMaterial({
  transparent: true, depthTest: false, depthWrite: false,
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy * 2.0, 0.0, 1.0); }',
  fragmentShader: `varying vec2 vUv;
    void main(){ float y = (1.0 - vUv.y) * 1920.0; gl_FragColor = vec4(0.031, 0.016, 0.086, 0.82 * (1.0 - smoothstep(380.0, 640.0, y))); }`,
}));
sombra.renderOrder = 1;
const destello = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShaderMaterial({
  transparent: true, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { fuerza: { value: 0 } },
  vertexShader: 'void main(){ gl_Position = vec4(position.xy * 2.0, 0.0, 1.0); }',
  fragmentShader: 'uniform float fuerza; void main(){ gl_FragColor = vec4(vec3(1.0, 0.85, 1.0) * fuerza, 1.0); }',
}));
destello.renderOrder = 4;
hud.add(sombra, velo, capaTexto, destello);

function textoNeon(texto, x, y, color, halo, blurs = [26, 10], nucleo = '#ffffff') {
  ctx.fillStyle = color;
  ctx.shadowColor = halo;
  for (const b of blurs) {
    ctx.shadowBlur = b;
    ctx.fillText(texto, x, y);
  }
  ctx.shadowBlur = 0;
  ctx.fillStyle = nucleo;
  ctx.fillText(texto, x, y);
}

// ------------------------------------------------------------------ posproceso: brillo y glitch
const compositor = new EffectComposer(renderer);
compositor.addPass(new RenderPass(escena, camara));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.6, 0.38, 0.32);
compositor.addPass(bloom);
compositor.addPass(new OutputPass());
const pasoHud = new RenderPass(hud, camaraHud);
pasoHud.clear = false;
compositor.addPass(pasoHud);
const glitch = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, fuerza: { value: 0 }, semilla: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float fuerza; uniform float semilla; varying vec2 vUv;
    float h(float x){ return fract(sin(x * 127.1 + semilla * 311.7) * 43758.5453); }
    void main(){
      if (fuerza <= 0.0) { gl_FragColor = texture2D(tDiffuse, vUv); return; }
      vec2 uv = vUv;
      float banda = floor(uv.y * (14.0 + 50.0 * h(1.0)));
      if (h(banda + 3.0) < 0.12 + 0.55 * fuerza) uv.x += (h(banda + 7.0) - 0.5) * 0.4 * fuerza;
      uv += (vec2(h(11.0), h(13.0)) - 0.5) * 0.035 * fuerza;
      float s = 0.004 + 0.035 * fuerza;
      vec3 c = vec3(texture2D(tDiffuse, uv + vec2(s, 0.0)).r, texture2D(tDiffuse, uv).g, texture2D(tDiffuse, uv - vec2(s, 0.0)).b);
      vec2 b = floor(uv * vec2(9.0, 16.0));
      if (h(b.x * 3.1 + b.y * 7.7) > 1.0 - 0.14 * fuerza) c = c.gbr * 1.7;
      c *= 1.0 - fuerza * 0.25 * (0.5 + 0.5 * sin(vUv.y * 2600.0));
      gl_FragColor = vec4(c, 1.0);
    }`,
});
compositor.addPass(glitch);

// ------------------------------------------------------------------ utilidades de tiempo
const clamp01 = x => Math.min(1, Math.max(0, x));
const suave = x => { x = clamp01(x); return x * x * (3 - 2 * x); };
const salida = x => 1 - Math.pow(1 - clamp01(x), 3);                         // entra rápido y se frena
const rebote = x => { x = clamp01(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function ultimo(lista, t) {                                                   // último tiempo <= t
  let lo = 0, hi = lista.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (lista[m] <= t) lo = m + 1; else hi = m; }
  return lo > 0 ? lista[lo - 1] : -99;
}
function azar(semilla) {
  let a = semilla >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let x = Math.imul(a ^ (a >>> 15), 1 | a);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

// Textos que flotan sobre la cuadrícula: [toma, texto, x, y, z, tamaño]
const FLOTANTES = [
  ['ghost', 'RUEDA', (xDePaso(11) + xDePaso(12)) / 2, TOPE + 2.95, zDeFila(0), 52],
  ['sidechain', 'SIDECHAIN', xDePaso(6), TOPE + 2.0, zDeFila(1), 50],
  ['swing', 'SWING', xDePaso(8), TOPE + 1.5, zDeFila(5), 54],
];
// Números que salen sobre los golpes: [toma, capa, textos]
const NUMEROS = [['kick', 'KICK', ['1', '2', '3', '4']], ['clap', 'CLAP', ['2', '4']]];

// ------------------------------------------------------------------ datos
let datos = null, D = null, lista = [], tKicks = [], tDrop = 0;
const color = new THREE.Color(), BLANCO = new THREE.Color(0xffffff), m4 = new THREE.Matrix4(), esc = new THREE.Vector3();

// Tomas de cámara (coordenadas del tablero plano). Cada una: posición y mirada al empezar y al terminar.
const TOMAS = {
  gancho: { p0: [-11, 2.6, 8.5], p1: [-5, 3.0, 9.5], l0: [-3.5, 0.4, 1.0], l1: [1.5, 0.4, 1.0] },
  hueco: { p0: [-7.5, 3.4, 8.0], p1: [-6.5, 3.2, 7.4], l0: [-1.0, 0.0, 1.4], l1: [0.0, 0.0, 1.4] },
  rumble: { p0: [-12, 7, 13.5], p1: [-10.5, 7.2, 14.4], l0: [0.5, -1.2, 0], l1: [1.0, -1.2, 0] },
  ghost: { p0: [-1.5, 4.0, 11], p1: [-0.8, 3.8, 10.4], l0: [3.6, 0.6, 1.2], l1: [3.8, 0.6, 1.2] },
  clap: { p0: [-11, 7.5, 14.5], p1: [-9.5, 7.7, 15.2], l0: [0.8, -1.2, -0.5], l1: [1.2, -1.2, -0.5] },
  hats: { p0: [-11.5, 8.8, 15.8], p1: [-12.8, 9.0, 14.8], l0: [1.2, -1.2, -1], l1: [1.0, -1.2, -1] },
  stab: { p0: [-7.5, 6.8, 12.2], p1: [-6, 6.4, 11.3], l0: [2.0, -0.8, -1.2], l1: [2.4, -0.8, -1.2] },
  // Solo en la versión larga
  kick: { p0: [-14.5, 7.5, 15], p1: [-13, 7.8, 15.8], l0: [-1.0, -1.4, 0.8], l1: [-0.5, -1.4, 0.8] },
  sidechain: { p0: [-6, 4.2, 10], p1: [-4.5, 4.0, 9.5], l0: [0, 0, 1.0], l1: [1, 0, 1.0] },
  open: { p0: [-12.8, 9, 14.8], p1: [-11, 8.6, 14], l0: [1.0, -1.2, -1], l1: [1.4, -1.2, -1.2] },
  swing: { p0: [-9.5, 8.5, 7.5], p1: [-8, 8.2, 7], l0: [1.0, -0.8, -3], l1: [1.8, -0.8, -3] },
  recap: { p0: [-14, 10, 17], p1: [-10, 10.5, 18], l0: [1, -1.5, -0.5], l1: [1, -1.5, -0.5] },
  antes: { p0: [-10, 6.5, 13], p1: [-9, 6.2, 12.5], l0: [0.8, -1, 0], l1: [1, -1, 0] },
  ahora: { p0: [-9, 6.2, 12.5], p1: [-12, 7.5, 14.5], l0: [1, -1, 0], l1: [1, -1, 0] },
  subida: { p0: [-12, 7.5, 14.5], p1: [-5.5, 4.2, 8.5], l0: [1, -1, 0], l1: [1.5, 0, 0] },
};
const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3(), vD = new THREE.Vector3();
function tomaEn(nombre, u, pos, mira) {
  const k = TOMAS[nombre], e = suave(u);
  pos.fromArray(k.p0).lerp(vD.fromArray(k.p1), e);
  mira.fromArray(k.l0).lerp(vD.fromArray(k.l1), e);
}

// [inicio, fin] de una toma; si esta versión no la tiene, nunca llega
function rango(nombre) {
  const s = D.secciones.find(x => x.toma === nombre);
  return s ? [s.t0, s.t1] : [1e9, 1e9];
}

function seccionEn(t) {
  let i = 0;
  while (i + 1 < D.secciones.length && D.secciones[i + 1].t0 <= t) i++;
  return i;
}

window.cargar = (d) => {
  datos = D = d;
  tDrop = D.secciones.find(s => s.toma === 'drop').t0;
  // Un bloque por (capa, paso): aparece en cascada cuando su capa entra, justo antes de su primer golpe
  const porClave = new Map();
  for (const [t, carril, paso, fuerza, capa] of D.golpes) {
    const clave = `${capa}-${paso}`;
    if (!porClave.has(clave)) {
      const sec = D.secciones.find(s => s.t0 <= t && t < s.t1);
      const aparece = capa === 'ROLL' ? t - 0.06 : Math.max(sec.t0 - 0.12, sec.t0 + paso * D.paso * 0.5 - 0.1);
      porClave.set(clave, { capa, carril, paso, fuerza, tiempos: [], aparece });
    }
    porClave.get(clave).tiempos.push(t);
    if (capa === 'KICK') tKicks.push(t);
  }
  lista = [...porClave.values()];
  // Ecos del stab: copias que se prenden 3 y 6 semicorcheas después de cada golpe
  const st = lista.find(b => b.capa === 'STAB');
  for (const k of [1, 2]) {
    lista.push({ capa: 'STAB', carril: st.carril, paso: st.paso + 3 * k, fuerza: 0.8, eco: k,
      tiempos: st.tiempos.map(t => t + 3 * k * D.paso), aparece: 99 });
  }
  tKicks.sort((a, b) => a - b);
};

// ------------------------------------------------------------------ dibujar un cuadro
const pos = new THREE.Vector3(), mira = new THREE.Vector3(), proy = new THREE.Vector3();
function aPantalla(x, y, z) {
  proy.set(x, y, z).applyMatrix4(tablero.matrixWorld).project(camara);
  return [(proy.x + 1) / 2 * W, (1 - proy.y) / 2 * H, proy.z < 1];
}

window.dibujar = (t) => {
  const f = Math.min(D.mapa.length - 1, Math.round(t * D.fps));
  const st = D.mapa[f];                         // segundo que se ve (el glitch lo traba)
  const is = seccionEn(st), sec = D.secciones[is];
  const u = (st - sec.t0) / (sec.t1 - sec.t0);
  const latido = Math.exp(-Math.max(0, st - ultimo(tKicks, st)) * 9);
  const enDrop = st >= tDrop;
  const pasoActual = ((st % D.compas) / D.paso);

  // Doblez del drop: la cuadrícula se enrolla en el primer tiempo y después gira al tempo
  doblez = enDrop ? suave((st - tDrop) / (D.beat * 1.6)) : 0;
  const tGiro = Math.max(0, st - tDrop - D.beat * 1.6), arranque = 0.6;
  const recorrido = tGiro < arranque ? tGiro * tGiro / (2 * arranque) : tGiro - arranque / 2;   // segundos "a velocidad plena"
  giro = -recorrido / D.paso * 1.0;                                          // una semicorchea por paso
  tablero.position.y = RADIO * doblez;
  tablero.rotation.y = 0.5 * doblez;
  tablero.rotation.x = 0.12 * doblez;
  const plano = 1 - doblez;

  // Baldosas: más claras en cada tiempo; la columna que suena se prende. Antes del drop se apagan.
  const [sb0, sb1] = rango('subida');
  const apagon = st >= sb1 - 2 * D.beat && st < sb1 ? 0.35 : 1;
  for (let p = 0, i = 0; p < PASOS; p++) {
    const enCabezal = !enDrop ? Math.max(0, 1 - Math.abs(pasoActual - 0.5 - p) * 1.4) : 0;
    for (let fi = 0; fi < FILAS; fi++, i++) {
      colocar(xDePaso(p), 0, zDeFila(fi));
      m4.compose(posTmp, quatTmp, esc.set(1, 1, 1));
      baldosas.setMatrixAt(i, m4);
      const base = p % 4 === 0 ? 0.15 : 0.1;
      color.setRGB(base * 0.75, base * 0.62, base * 1.15);
      color.g += 0.16 * enCabezal; color.b += 0.2 * enCabezal;
      color.multiplyScalar(apagon);
      baldosas.setColorAt(i, color);
    }
  }
  baldosas.instanceMatrix.needsUpdate = baldosas.instanceColor.needsUpdate = true;
  cabezal.position.x = xDePaso(Math.floor(pasoActual));
  cabezal.material.opacity = enDrop ? 0 : 0.12;
  marco.material.opacity = 0.5 * plano;

  // Bloques
  let nb = 0, na = 0, nc = 0;
  const pc = geoChispas.attributes.position.array, cc = geoChispas.attributes.color.array;
  const [a0, a1] = rango('antes'), [h0] = rango('ahora');
  const swing = D.swing > 0 && st >= D.swing ? 0.3 * suave((st - D.swing - 0.5) / 0.5) : 0;
  for (const b of lista) {
    const cfg = CAPAS[b.capa];
    const ult = ultimo(b.tiempos, st), edad = st - ult;
    if (b.capa === 'ROLL' && st > b.tiempos[b.tiempos.length - 1] + 0.3) continue;
    // Antes / ahora: todo menos el kick se hunde y luego vuelve a saltar
    let mudo = 1;
    if (b.capa !== 'KICK' && !b.eco) {
      if (st >= a0 && st < a1) mudo = 1 - salida((st - a0) / 0.3);
      else if (st >= h0 && st < h0 + 1.2) mudo = rebote((st - h0 - b.paso * 0.012 - b.carril * 0.04) / 0.3);
      if (mudo < 0.02) continue;
    }
    // Swing: los contratiempos de los hats se corren un poquito a la derecha
    const xb = xDePaso(b.paso) + ((b.capa === 'HATS' || b.capa === 'OPEN HAT') && b.paso % 2 ? swing : 0);
    let crece, golpe = edad >= 0 && edad < 2 ? Math.exp(-edad * 11) : 0;
    if (b.eco) {
      // Los ecos solo existen mientras se prenden
      const nivel = Math.pow(0.5, b.eco);
      crece = edad >= 0 && edad < 0.6 ? Math.exp(-edad * 7) * nivel * 1.6 : 0;
      golpe = crece;
      if (crece < 0.02) continue;
    } else {
      crece = rebote((st - b.aparece) / 0.28);
      if (st < b.aparece) continue;
    }
    // Sidechain: el rumble se agacha con cada kick
    const agacha = b.capa === 'RUMBLE' && st >= D.sidechain ? 1 - 0.6 * latido : 1;
    const alto = Math.max(0.02, cfg.alto * (b.capa === 'GHOST' ? 0.32 : b.fuerza) * crece * mudo * agacha * (1 + 0.18 * golpe));
    colocar(xb, TOPE + alto / 2, zDeFila(b.carril));
    m4.compose(posTmp, quatTmp, esc.set(1 + 0.08 * golpe, alto, 1 + 0.08 * golpe));
    bloques.setMatrixAt(nb, m4);
    color.set(cfg.color).lerp(BLANCO, 0.55 * golpe).multiplyScalar(0.75 + 0.9 * golpe);
    bloques.setColorAt(nb++, color);

    // Anillo y chispas de cada golpe reciente
    if (edad >= 0 && edad < 0.55 && !b.eco && na < MAX_ANILLOS) {
      colocar(xb, TOPE + 0.015, zDeFila(b.carril));
      const s = 1 + edad * 2.6;
      m4.compose(posTmp, quatTmp, esc.set(s, 1, s));
      anillos.setMatrixAt(na, m4);
      color.set(cfg.color).lerp(BLANCO, 0.4).multiplyScalar(Math.pow(1 - edad / 0.55, 2) * 1.3);
      anillos.setColorAt(na++, color);
    }
    if (edad >= 0 && edad < 0.75 && !b.eco) {
      tablero.updateMatrixWorld();
      colocar(xb, TOPE + alto, zDeFila(b.carril));
      const origen = vA.copy(posTmp).applyMatrix4(tablero.matrixWorld);
      const arriba = vB.set(0, 1, 0).applyQuaternion(quatTmp).applyQuaternion(tablero.quaternion);
      const n = b.capa === 'HATS' ? 3 : b.capa === 'GHOST' ? 4 : 10;
      const r = azar(Math.round(ult * 1000) * 31 + b.paso * 7 + b.carril);
      for (let k = 0; k < n && nc < MAX_CHISPAS; k++, nc++) {
        const v = 2.2 + r() * 2.8, a = r() * Math.PI * 2, lat = 1.2 + r() * 1.6, vida = 0.45 + r() * 0.3;
        if (edad > vida) { nc--; continue; }
        const vx = arriba.x * v + Math.cos(a) * lat, vy = arriba.y * v + 0.5, vz = arriba.z * v + Math.sin(a) * lat;
        const fr = 1 - edad * 0.9;                                    // freno de aire
        pc[nc * 3] = origen.x + vx * edad * fr;
        pc[nc * 3 + 1] = origen.y + vy * edad * fr - 4.5 * edad * edad;
        pc[nc * 3 + 2] = origen.z + vz * edad * fr;
        const vivo = Math.pow(1 - edad / vida, 1.5);
        color.set(cfg.color).lerp(BLANCO, Math.max(0, 1 - edad * 5)).multiplyScalar(vivo * 1.4);
        cc[nc * 3] = color.r; cc[nc * 3 + 1] = color.g; cc[nc * 3 + 2] = color.b;
      }
    }
  }
  bloques.count = nb;
  anillos.count = na;
  bloques.instanceMatrix.needsUpdate = anillos.instanceMatrix.needsUpdate = true;
  if (bloques.instanceColor) bloques.instanceColor.needsUpdate = true;
  if (anillos.instanceColor) anillos.instanceColor.needsUpdate = true;
  geoChispas.setDrawRange(0, nc);
  geoChispas.attributes.position.needsUpdate = geoChispas.attributes.color.needsUpdate = true;

  // Anotaciones
  const tomaVis = rango;
  anot.visible = !enDrop;
  {
    const [h0] = tomaVis('hueco'), [r0, r1] = tomaVis('rumble');
    for (const l of huecos.children) {
      // Cada contorno se apaga cuando su bloque de rumble lo llena
      const lleno = lista.find(b => b.capa === 'RUMBLE' && b.paso === l.userData.paso);
      const fuera = lleno ? clamp01((st - lleno.aparece) / 0.15) : clamp01((st - r1 + 0.3) / 0.3);
      const pulso = 0.65 + 0.35 * Math.sin(st * 14);
      l.material.opacity = salida((st - h0 - 0.1 - l.userData.paso * 0.02) / 0.25) * (1 - fuera) * pulso;
      l.visible = l.material.opacity > 0.01;
    }
    // Las X: en la toma del sidechain si la hay; si no, en el segundo compás del rumble
    const [c0, c1] = rango('sidechain')[0] < 1e9 ? rango('sidechain') : [r0 + D.compas - 0.3, r1];
    const tx = c0 + 0.3;
    equis.forEach((g, i) => {
      const k = salida((st - tx - i * 0.12) / 0.22) * (1 - clamp01((st - c1 + 0.2) / 0.3));
      g.scale.setScalar(Math.max(0.001, k * (1 + 0.3 * (1 - k))));
      g.visible = k > 0.01;
    });
    const [g0, g1] = tomaVis('ghost');
    const kf = salida((st - g0 - 0.35) / 0.55), fuera = 1 - clamp01((st - g1 + 0.15) / 0.2);
    geoFlecha.setDrawRange(0, Math.floor(geoFlecha.index.count * kf / 3) * 3);
    flecha.visible = kf > 0 && fuera > 0;
    flecha.material.opacity = fuera;
    punta.visible = kf >= 1 && fuera > 0;
    punta.material.opacity = fuera;
    const [o0, o1] = rango('open')[0] < 1e9 ? rango('open') : rango('hats');
    contras.children.forEach((l, i) => {
      l.material.opacity = salida((st - o0 - 0.6 - i * 0.1) / 0.25) * (1 - clamp01((st - o1 + 0.15) / 0.2));
      l.visible = l.material.opacity > 0.01;
    });
    const [w0, w1] = rango('swing');
    sinSwing.children.forEach((l, i) => {
      l.material.opacity = 0.8 * salida((st - w0 - 0.3 - i * 0.05) / 0.25) * (1 - clamp01((st - w1 + 0.15) / 0.2));
      l.visible = l.material.opacity > 0.01;
    });
    const [s0, s1] = tomaVis('stab');
    const kc = salida((st - s0 - 0.15) / 0.45);
    circulo.geometry.setDrawRange(0, Math.floor(97 * kc));
    circulo.visible = kc > 0 && st < s1 - 0.05;
  }

  // Cámara
  if (!enDrop) {
    tomaEn(sec.toma, u, pos, mira);
    const dt = st - sec.t0;
    if (is > 0 && dt < 0.55) {
      tomaEn(D.secciones[is - 1].toma, 1, vA, vB);
      const e = suave(dt / 0.55);
      pos.copy(vA.lerp(pos, e));
      mira.copy(vB.lerp(mira, e));
    }
    if (sec.toma === 'gancho' || sec.toma === 'hueco') pos.y += 0.06 * latido;   // el kick sacude un poco
    if (sec.toma === 'subida') {
      const tiembla = 0.12 * u * u;
      pos.x += Math.sin(st * 53) * tiembla;
      pos.y += Math.sin(st * 71) * tiembla;
    }
  } else {
    // Clímax: la cámara se aleja y gira alrededor de la rueda
    const td = st - tDrop;
    tomaEn(D.secciones[D.secciones.findIndex(x => x.toma === 'drop') - 1].toma, 1, vA, vB);
    // Gira medio lado en todo el clímax y en la segunda parte se aleja más
    const a = -0.95 + 1.5 * suave(td / 11), r = 17 + 3 * salida(td / 2.5) + 5 * suave((td - 5) / 3);
    vC.set(Math.sin(a) * r, 4.5 + 1.5 * Math.sin(td * 0.8) + 2.5 * suave((td - 5) / 3), Math.cos(a) * r);
    const e = suave(td / 0.9);
    pos.copy(vA.lerp(vC, e));
    mira.copy(vB.lerp(vD.set(0, 0.5, 0), e));
    pos.y += 0.12 * latido;
  }
  camara.position.copy(pos);
  camara.lookAt(mira);
  camara.updateMatrixWorld();
  tablero.updateMatrixWorld();

  sol.material.uniforms.latido.value = latido;
  sol.scale.setScalar(1 + 0.015 * latido);
  piso.material.uniforms.avance.value = st * (D.bpm / 60) * 2.5;
  piso.material.uniforms.latido.value = latido;
  bloom.strength = 0.55 + 0.1 * latido + (enDrop ? 0.1 : 0) + (sec.toma === 'subida' ? 0.35 * u * apagon : 0);
  destello.material.uniforms.fuerza.value = t >= tDrop ? 0.85 * Math.exp(-(t - tDrop) * 7) : 0;

  // ---------------------------------------------------------------- capa 2D
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  const cierre = t >= D.cierre ? clamp01((t - D.cierre) / 0.25) : 0;
  velo.material.uniforms.opacidad.value = cierre * 0.88;

  if (cierre < 1) {
    ctx.globalAlpha = 1 - cierre;
    // Barra de transporte
    const y0 = 196, alto = 64;
    ctx.strokeStyle = 'rgba(0,240,255,0.55)';
    ctx.lineWidth = 2;
    ctx.fillStyle = 'rgba(0,240,255,0.05)';
    ctx.beginPath();
    ctx.roundRect(48, y0, W - 96, alto, 32);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#ff32d2';
    ctx.shadowColor = '#ff32d2';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(84, y0 + 18); ctx.lineTo(108, y0 + 32); ctx.lineTo(84, y0 + 46);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.font = 'bold 34px Futura';
    textoNeon(String(D.bpm), 128, y0 + 33, '#00f0ff', '#00dcff', [10]);
    ctx.font = '600 18px "Avenir Next"';
    ctx.fillStyle = '#b9b4ff';
    ctx.fillText('BPM', 196, y0 + 37);
    ctx.font = 'bold 30px Menlo';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('4/4', 260, y0 + 33);
    const compas = Math.floor(st / D.compas) + 1, tiempo = Math.floor((st % D.compas) / D.beat) + 1;
    const semi = Math.floor((st % D.beat) / D.paso) + 1;
    ctx.fillText(`${String(compas).padStart(3, '0')}.${tiempo}.${semi}`, 350, y0 + 33);
    for (let i = 0; i < 4; i++) {
      const on = i === tiempo - 1;
      ctx.fillStyle = on ? '#00f0ff' : 'rgba(185,180,255,0.35)';
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = on ? 16 : 0;
      ctx.beginPath();
      ctx.arc(600 + i * 34, y0 + 32, on ? 9 : 7, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.textAlign = 'right';
    ctx.font = 'bold 22px Futura';
    ctx.letterSpacing = '4px';
    textoNeon('NEON KEYS', W - 82, y0 + 33, '#ff32d2', '#ff32d2', [10]);
    ctx.letterSpacing = '0px';

    // Subtítulo palabra por palabra (la palabra clave en rosa)
    ctx.font = 'bold 72px Futura';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    const espacio = ctx.measureText(' ').width, maxAncho = 940, interlineado = 90;
    const lineas = [[]];
    let ancho = 0;
    for (const p of sec.palabras) {
      const w = ctx.measureText(p.txt).width;
      if (ancho + w > maxAncho && lineas[lineas.length - 1].length) { lineas.push([]); ancho = 0; }
      lineas[lineas.length - 1].push({ ...p, w });
      ancho += w + espacio;
    }
    const salidaTexto = 1 - clamp01((st - (sec.t1 - 0.12)) / 0.12);
    lineas.forEach((ls, li) => {
      const total = ls.reduce((a, p) => a + p.w, 0) + espacio * (ls.length - 1);
      let x = (W - total) / 2;
      const y = 370 + li * interlineado;
      for (const p of ls) {
        const k = salida((st - p.t) / 0.18);
        if (k > 0) {
          ctx.save();
          ctx.globalAlpha = (1 - cierre) * k * salidaTexto;
          ctx.translate(x + p.w / 2, y + 22 * (1 - k));
          ctx.scale(0.9 + 0.1 * k, 0.9 + 0.1 * k);
          if (p.clave) textoNeon(p.txt, -p.w / 2, 0, '#ff32d2', '#ff32d2', [30, 12], '#ff78e6');
          else textoNeon(p.txt, -p.w / 2, 0, '#00dcff', '#00dcff', [22, 8]);
          ctx.restore();
        }
        x += p.w + espacio;
      }
    });

    // Etiquetas de los carriles (solo con la cuadrícula plana)
    if (doblez < 0.25) {
      ctx.globalAlpha = (1 - cierre) * (1 - doblez * 4);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      const foco = sec.toma === 'recap'
        ? [D.carriles[Math.min(FILAS - 1, Math.floor(u * FILAS * 1.15))]]
        : FOCO[sec.toma] || [];
      D.carriles.forEach((capa, fi) => {
        const resalta = foco.includes(capa);
        if (!resalta && !(st >= D.entrada[capa] - 0.25)) return;
        // Al inicio del carril; si queda fuera de cuadro, en el primer punto visible de la fila
        let sx = -1, sy = 0;
        for (let x = xDePaso(0) - 1.6; x < xDePaso(PASOS - 1); x += 0.25) {
          const [px, py, delante] = aPantalla(x, TOPE, zDeFila(fi));
          if (delante && px >= 56 && px < W - 200 && py > 300 && py < 1580) { sx = px; sy = py; break; }
        }
        if (sx < 0) return;
        ctx.font = `bold ${resalta ? 32 : 26}px Futura`;
        const ancho = ctx.measureText(capa).width;
        ctx.fillStyle = 'rgba(8,4,22,0.72)';
        ctx.beginPath();
        ctx.roundRect(sx - 14, sy - 24, ancho + 28, 48, 24);
        ctx.fill();
        if (resalta) textoNeon(capa, sx, sy + 1, '#ff32d2', '#ff32d2', [16], '#ff78e6');
        else { ctx.fillStyle = 'rgba(235,230,255,0.9)'; ctx.fillText(capa, sx, sy + 1); }
      });
      ctx.globalAlpha = 1 - cierre;
    }

    // Textos de las anotaciones: RUEDA y los números del clap
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const [toma, texto, x, y, z, tam] of FLOTANTES) {
      const [f0, f1] = rango(toma);
      const k = salida((st - f0 - 0.85) / 0.25) * (1 - clamp01((st - f1 + 0.15) / 0.2));
      if (k <= 0) continue;
      const [sx, sy] = aPantalla(x, y, z);
      ctx.globalAlpha = k * (1 - cierre);
      ctx.font = `bold ${Math.round(tam * (0.8 + 0.2 * k))}px Futura`;
      textoNeon(texto, sx, sy, '#00dcff', '#00dcff', [24, 10]);
    }
    for (const [toma, capa, numeros] of NUMEROS) {
      const [n0, n1] = rango(toma);
      lista.filter(b => b.capa === capa).sort((a, b) => a.paso - b.paso).forEach((b, i) => {
        const tg = b.tiempos.find(x => x >= n0) ?? 99;
        const kk = salida((st - tg) / 0.2) * (1 - clamp01((st - n1 + 0.15) / 0.2));
        if (kk <= 0) return;
        const [sx, sy] = aPantalla(xDePaso(b.paso), TOPE + CAPAS[capa].alto + 0.95, zDeFila(b.carril));
        ctx.globalAlpha = kk * (1 - cierre);
        ctx.font = `bold ${Math.round(110 * (0.7 + 0.3 * kk))}px Futura`;
        textoNeon(numeros[i], sx, sy, '#00dcff', '#00dcff', [30, 12]);
      });
    }
    ctx.globalAlpha = 1;
  }

  // Cierre: monograma NK + llamada a seguir
  if (cierre > 0) {
    const k = salida((t - D.cierre) / 0.45);
    ctx.globalAlpha = cierre;
    ctx.textBaseline = 'middle';
    ctx.font = `bold ${Math.round(300 * (0.85 + 0.15 * k))}px Futura`;
    ctx.textAlign = 'right';
    textoNeon('N', W / 2 + 8, 860, '#00f0ff', '#00f0ff', [60, 26]);
    ctx.textAlign = 'left';
    textoNeon('K', W / 2 - 8, 860, '#ff32d2', '#ff32d2', [60, 26]);
    ctx.textAlign = 'center';
    ctx.font = 'bold 40px Futura';
    ctx.letterSpacing = '10px';
    textoNeon('NEON KEYS', W / 2, 1060, '#ff32d2', '#ff32d2', [18]);
    ctx.letterSpacing = '0px';
    const k2 = salida((t - D.cierre - 0.3) / 0.3);
    ctx.globalAlpha = cierre * k2;
    ctx.font = '600 56px "Avenir Next"';
    textoNeon(D.cierreTexto, W / 2, 1170 + 16 * (1 - k2), '#00dcff', '#00dcff', [18, 8]);
    ctx.globalAlpha = 1;
  }
  texHud.needsUpdate = true;

  // Glitch al final del drop
  const [gl0, gl1] = D.glitch;
  glitch.uniforms.fuerza.value = t >= gl0 && t < gl1 ? 0.35 + 0.65 * (t - gl0) / (gl1 - gl0) : 0;
  glitch.uniforms.semilla.value = f;

  renderer.clear();
  compositor.render();
};
window.listo = true;
</script>
</body>
</html>
