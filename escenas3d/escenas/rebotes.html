<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: #07040f; overflow: hidden; }</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
// Bolitas en 3D (versión esfera de rebotes.py): una esfera neón de alambre con un hueco que gira. Las bolitas
// rebotan dentro; cada una que sale por el hueco hace nacer 2 en el núcleo. La física está en /rebotes3d.js
// y aquí se vuelve a simular (es determinista) para dibujar. Al final el video "se traba" (glitch).
// grabar.js llama a window.cargar(datos) (datos de rebotes3d.mjs + capas de rebotes3d_sonido.py) y luego a
// window.dibujar(t) para cada cuadro.
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { crearSimulacion, dirHueco, pulsoBombo } from '/rebotes3d.js';

const W = 1080, H = 1920;
const CIAN = 0x00e5ff, MAGENTA = 0xff2bd6;
// Misma paleta que rebotes.py: cian, magenta, amarillo, verde, naranja, morado
const PALETA = [0x00e5ff, 0xff2bd6, 0xffe146, 0x5aff9f, 0xff8c3c, 0xaa64ff].map(c => new THREE.Color(c));
const BLANCO = new THREE.Color(0xffffff);
const MAX_BOLITAS = 4000;
const MAX_ONDAS = 40;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

const escena = new THREE.Scene();
escena.background = new THREE.Color(0x07040f);
escena.fog = new THREE.Fog(0x07040f, 18, 46);
const camara = new THREE.PerspectiveCamera(50, W / H, 0.1, 200);

escena.add(new THREE.HemisphereLight(0xc8d0ff, 0x1a0f2a, 0.9));
const luz = new THREE.DirectionalLight(0xffffff, 1.6);
luz.position.set(4, 8, 6);
escena.add(luz);
// Luz del núcleo (late con los nacimientos)
const luzNucleo = new THREE.PointLight(0xffffff, 0, 9, 1.5);
escena.add(luzNucleo);

// ------------------------------------------------------------------ fondo: estrellas y piso synthwave
{
  const n = 1800, pos = new Float32Array(n * 3);
  let s = 12345;
  const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < n; i++) {
    const u = rnd() * 2 - 1, a = rnd() * Math.PI * 2, r = 60 + rnd() * 30, q = Math.sqrt(1 - u * u);
    pos.set([q * Math.cos(a) * r, Math.abs(u) * r * 0.9 - 8, q * Math.sin(a) * r], i * 3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  escena.add(new THREE.Points(geo, new THREE.PointsMaterial({ color: 0x9a8cff, size: 1.6, sizeAttenuation: false, fog: false })));
}
const piso = new THREE.Mesh(
  new THREE.PlaneGeometry(140, 140),
  new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { avance: { value: 0 }, latido: { value: 0 } },
    vertexShader: `varying vec3 vMundo;
      void main(){ vec4 m = modelMatrix * vec4(position, 1.0); vMundo = m.xyz; gl_Position = projectionMatrix * viewMatrix * m; }`,
    fragmentShader: `uniform float avance; uniform float latido; varying vec3 vMundo;
      float linea(float x){ float w = fwidth(x); return 1.0 - smoothstep(0.0, 1.4 * w, abs(fract(x - 0.5) - 0.5)); }
      void main(){
        vec2 p = vMundo.xz / 2.2;
        p.y += avance;
        float g = max(linea(p.x), linea(p.y));
        float d = length(vMundo.xz);
        float desv = exp(-d * 0.045);
        vec3 col = mix(vec3(1.0, 0.17, 0.84), vec3(0.0, 0.9, 1.0), smoothstep(30.0, 6.0, d));
        gl_FragColor = vec4(col * g * desv * (0.55 + 0.35 * latido), g * desv);
      }`,
  }),
);
piso.rotation.x = -Math.PI / 2;
piso.position.y = -7.5;
escena.add(piso);

// ------------------------------------------------------------------ esfera de alambre con hueco
const esfera = new THREE.Mesh(
  new THREE.SphereGeometry(1, 160, 96),
  new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    uniforms: {
      t: { value: 0 }, hueco: { value: new THREE.Vector3(1, 0, 0) }, cosHueco: { value: 0.5 },
      ondas: { value: Array.from({ length: MAX_ONDAS }, () => new THREE.Vector4(0, 0, 0, -99)) },
      borde: { value: 0 }, latido: { value: 0 }, fuerza: { value: 1 },
    },
    vertexShader: `varying vec3 vLocal; varying vec3 vNormal; varying vec3 vVista;
      void main(){
        vLocal = position;
        vec4 m = modelMatrix * vec4(position, 1.0);
        vNormal = normalize(mat3(modelMatrix) * normal);
        vVista = cameraPosition - m.xyz;
        gl_Position = projectionMatrix * viewMatrix * m;
      }`,
    fragmentShader: `uniform float t; uniform vec3 hueco; uniform float cosHueco; uniform vec4 ondas[${MAX_ONDAS}];
      uniform float borde; uniform float latido; uniform float fuerza;
      varying vec3 vLocal; varying vec3 vNormal; varying vec3 vVista;
      float linea(float x, float grosor){ float w = fwidth(x); return 1.0 - smoothstep(0.0, grosor * w, abs(fract(x - 0.5) - 0.5)); }
      void main(){
        vec3 n = normalize(vLocal);
        float c = dot(n, hueco);
        if (c > cosHueco) discard;
        // Rejilla de meridianos y paralelos que gira despacio
        float lat = asin(clamp(n.y, -1.0, 1.0));
        float lon = atan(n.z, n.x) + t * 0.12;
        float rej = max(linea(lat / 3.14159 * 16.0, 1.3), linea(lon / 3.14159 * 16.0, 1.3) * (1.0 - smoothstep(0.8, 0.98, abs(n.y))));
        // Ondas: cada golpe que suena prende un anillo que se abre sobre la esfera
        float onda = 0.0;
        for (int i = 0; i < ${MAX_ONDAS}; i++) {
          float edad = t - ondas[i].w;
          if (edad < 0.0 || edad > 0.9) continue;
          float a = acos(clamp(dot(n, ondas[i].xyz), -1.0, 1.0));
          float radio = 0.06 + edad * 0.75;
          onda += exp(-pow((a - radio) / 0.03, 2.0)) * (1.0 - edad / 0.9) * 0.6 + exp(-a * a / 0.002) * exp(-edad * 12.0) * 0.8;
        }
        // Borde del hueco: aro brillante
        float aro = smoothstep(cosHueco - 0.07, cosHueco, c);
        float fres = pow(1.0 - abs(dot(normalize(vNormal), normalize(vVista))), 2.2);
        vec3 col = mix(vec3(0.0, 0.9, 1.0), vec3(1.0, 0.17, 0.84), 0.5 + 0.5 * sin(lon * 1.0 + n.y * 2.2 + t * 0.5));
        float trasera = gl_FrontFacing ? 1.0 : 0.4;
        float k = (0.02 + rej * (0.3 + 0.25 * latido) + fres * 0.14) * trasera + onda * 0.45 * trasera + aro * (0.7 + 0.4 * borde);
        vec3 salida = col * k + vec3(1.0) * aro * 0.12 * (0.5 + borde);
        gl_FragColor = vec4(salida * fuerza, 1.0);
      }`,
  }),
);
escena.add(esfera);

// Núcleo: donde nacen las bolitas
const nucleo = new THREE.Mesh(
  new THREE.SphereGeometry(1, 32, 16),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }),
);
escena.add(nucleo);

// ------------------------------------------------------------------ bolitas y estelas
const matBolita = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.28, metalness: 0.15 });
// Brillo propio con el color de cada bolita (sin "corazón" blanco, como en la versión 2D)
matBolita.onBeforeCompile = (sh) => {
  sh.fragmentShader = sh.fragmentShader.replace('#include <emissivemap_fragment>',
    '#include <emissivemap_fragment>\n#ifdef USE_INSTANCING_COLOR\n totalEmissiveRadiance += vColor.rgb * 0.3;\n#endif');
};
const bolitas = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 18, 12), matBolita, MAX_BOLITAS);
bolitas.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
bolitas.setColorAt(0, BLANCO);
bolitas.frustumCulled = false;
escena.add(bolitas);

// Estela: cono translúcido de la bolita hacia atrás (en dirección contraria a la velocidad)
const geoEstela = new THREE.ConeGeometry(1, 1, 10, 1, true);
geoEstela.translate(0, 0.5, 0);    // base (ancha) en la bolita, punta hacia +Y
const estelas = new THREE.InstancedMesh(geoEstela, new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  vertexShader: `varying vec3 vColor; varying float vF;
    void main(){
      vColor = instanceColor; vF = 1.0 - uv.y;   // 1 junto a la bolita, 0 en la punta
      gl_Position = projectionMatrix * modelViewMatrix * instanceMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `varying vec3 vColor; varying float vF;
    void main(){ gl_FragColor = vec4(vColor * vF * vF * 0.45, 1.0); }`,
}), MAX_BOLITAS);
estelas.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
estelas.setColorAt(0, BLANCO);
estelas.frustumCulled = false;
escena.add(estelas);

// ------------------------------------------------------------------ capas 2D (título, marca, contador, cierre)
const hud = new THREE.Scene();
const camaraHud = new THREE.OrthographicCamera(-0.5, 0.5, 0.5, -0.5, 0, 1);

// Capa en modo "screen" sobre un rectángulo de la pantalla (en píxeles), como en neon_keys.py
function capaScreen(textura, y0 = 0, y1 = H, orden = 2) {
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthTest: false, depthWrite: false,
    blending: THREE.CustomBlending, blendEquation: THREE.AddEquation,
    blendSrc: THREE.OneMinusDstColorFactor, blendDst: THREE.OneFactor,
    uniforms: { mapa: { value: textura }, fuerza: { value: 1 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy * 2.0, 0.0, 1.0); }',
    fragmentShader: `uniform sampler2D mapa; uniform float fuerza; varying vec2 vUv;
      void main(){ gl_FragColor = vec4(texture2D(mapa, vUv).rgb * fuerza, 1.0); }`,
  });
  const geo = new THREE.PlaneGeometry(1, (y1 - y0) / H);
  geo.translate(0, 0.5 - (y0 + y1) / 2 / H, 0);
  const malla = new THREE.Mesh(geo, mat);
  malla.renderOrder = orden;
  hud.add(malla);
  return malla;
}

function capaColor(color, orden) {
  const malla = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShaderMaterial({
    transparent: true, depthTest: false, depthWrite: false,
    uniforms: { color: { value: new THREE.Color(color) }, opacidad: { value: 0 } },
    vertexShader: 'void main(){ gl_Position = vec4(position.xy * 2.0, 0.0, 1.0); }',
    fragmentShader: 'uniform vec3 color; uniform float opacidad; void main(){ gl_FragColor = vec4(color, opacidad); }',
  }));
  malla.renderOrder = orden;
  hud.add(malla);
  return malla;
}

// Contador: se dibuja cada cuadro en un canvas 2D (Futura, como el resto de la marca)
const Y_CONTADOR0 = 1360, Y_CONTADOR1 = 1600;
const lienzo = document.createElement('canvas');
lienzo.width = W;
lienzo.height = Y_CONTADOR1 - Y_CONTADOR0;
const ctx = lienzo.getContext('2d');
const texContador = new THREE.CanvasTexture(lienzo);
texContador.colorSpace = THREE.NoColorSpace;
texContador.minFilter = THREE.LinearFilter;
texContador.generateMipmaps = false;
let capaTitulo = null, capaMarca = null, capaCierre = null;
const capaContador = capaScreen(texContador, Y_CONTADOR0, Y_CONTADOR1, 2);
const velo = capaColor(0x080416, 3);
const fundido = capaColor(0x000000, 5);

function dibujarContador(total, golpe) {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, lienzo.width, lienzo.height);
  const texto = total.toLocaleString('es-MX');
  const tam = 104 * (1 + 0.08 * golpe);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `bold ${tam.toFixed(1)}px Futura`;
  ctx.fillStyle = '#ff2bd6';
  ctx.shadowColor = '#ff2bd6';
  for (const blur of [40, 18]) {
    ctx.shadowBlur = blur;
    ctx.fillText(texto, W / 2, 95);
  }
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ffffff';
  ctx.fillText(texto, W / 2, 95);
  ctx.font = '600 30px "Avenir Next"';
  ctx.fillStyle = '#e6dcff';
  ctx.shadowColor = '#00e5ff';
  ctx.shadowBlur = 12;
  ctx.fillText('B O L I T A S', W / 2, 175);
  ctx.shadowBlur = 0;
  texContador.needsUpdate = true;
}

async function cargarCapas(capas) {
  const cargador = new THREE.TextureLoader();
  const textura = async (url) => {
    const tx = await cargador.loadAsync(url);
    tx.colorSpace = THREE.NoColorSpace;
    tx.minFilter = THREE.LinearFilter;
    tx.generateMipmaps = false;
    return tx;
  };
  capaTitulo = capaScreen(await textura(capas.titulo));
  capaMarca = capaScreen(await textura(capas.marca));
  capaCierre = capaScreen(await textura(capas.cierre), 0, H, 4);
}

// ------------------------------------------------------------------ posproceso: brillo y glitch
const compositor = new EffectComposer(renderer);
compositor.addPass(new RenderPass(escena, camara));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.45, 0.3, 0.4);
compositor.addPass(bloom);
compositor.addPass(new OutputPass());
const pasoHud = new RenderPass(hud, camaraHud);
pasoHud.clear = false;
compositor.addPass(pasoHud);
const glitch = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, fuerza: { value: 0 }, semilla: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float fuerza; uniform float semilla; varying vec2 vUv;
    float h(float x){ return fract(sin(x * 127.1 + semilla * 311.7) * 43758.5453); }
    void main(){
      vec2 uv = vUv;
      if (fuerza > 0.0) {
        // Franjas desplazadas de lado
        float banda = floor(uv.y * (14.0 + 50.0 * h(1.0)));
        if (h(banda + 3.0) < 0.12 + 0.55 * fuerza) uv.x += (h(banda + 7.0) - 0.5) * 0.4 * fuerza;
        // Temblor
        uv += (vec2(h(11.0), h(13.0)) - 0.5) * 0.035 * fuerza;
      }
      float s = 0.004 + 0.035 * fuerza;
      vec3 c = vec3(texture2D(tDiffuse, uv + vec2(s, 0.0)).r, texture2D(tDiffuse, uv).g, texture2D(tDiffuse, uv - vec2(s, 0.0)).b);
      if (fuerza > 0.0) {
        // Bloques con los colores cruzados
        vec2 b = floor(uv * vec2(9.0, 16.0));
        if (h(b.x * 3.1 + b.y * 7.7) > 1.0 - 0.14 * fuerza) c = c.gbr * 1.7;
        c *= 1.0 - fuerza * 0.25 * (0.5 + 0.5 * sin(vUv.y * 2600.0));
        if (fuerza > 0.8 && h(21.0) < 0.3) c = 1.0 - c;   // destello invertido
      } else {
        c = texture2D(tDiffuse, uv).rgb;
      }
      gl_FragColor = vec4(c, 1.0);
    }`,
});
compositor.addPass(glitch);

// ------------------------------------------------------------------ simulación con memoria de los últimos cuadros
let datos = null, cfg = null, sim = null;
const memoria = new Map();   // cuadro de simulación → copia del estado
const sonidosPorBolita = new Map();
let tiemposEscape = [];

function nuevaSimulacion() {
  sim = crearSimulacion(cfg);
  memoria.clear();
}

function estadoEn(k) {
  if (memoria.has(k)) return memoria.get(k);
  if (!sim || k < sim.cuadro) nuevaSimulacion();
  while (sim.cuadro <= k) {
    if (sim.cuadro >= k - 45) {
      const e = sim.estado();
      memoria.set(sim.cuadro, {
        n: e.n, total: e.total, P: e.P.slice(0, 3 * e.n), V: e.V.slice(0, 3 * e.n),
        ID: e.ID.slice(0, e.n), FUERA: e.FUERA.slice(0, e.n),
      });
      for (const c of memoria.keys()) if (c < k - 45) memoria.delete(c);
    }
    sim.avanzar();
  }
  // Comprobación: la escena debe simular exactamente lo mismo que rebotes3d.mjs (si no, el sonido no cuadra)
  const g = sim.golpes, i = g.length - 1;
  if (i >= 0 && i < datos.golpes.length && (datos.golpes[i][1] !== g[i][1] || Math.abs(datos.golpes[i][0] - g[i][0]) > 1e-3)) {
    throw new Error(`La simulación de la escena no coincide con la del sonido (golpe ${i})`);
  }
  return memoria.get(k);
}

// Últimos índices con tiempo <= t en una lista ordenada por tiempo
function hasta(lista, t) {
  let lo = 0, hi = lista.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (lista[m][0] <= t) lo = m + 1; else hi = m; }
  return lo;
}

const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), v3 = new THREE.Vector3(), s3 = new THREE.Vector3();
const ARRIBA = new THREE.Vector3(0, 1, 0), dir = new THREE.Vector3(), color = new THREE.Color();

window.dibujar = (t) => {
  const f = Math.min(datos.mapa.length - 1, Math.round(t * cfg.fps));
  const st = datos.mapa[f];                   // segundo de la simulación que se ve (el glitch lo traba)
  const k = Math.round(st * cfg.fps);
  const e = estadoEn(k);
  const R = cfg.R, r = cfg.r;
  const latido = pulsoBombo(st, cfg);
  const climax = st > cfg.climax ? Math.exp(-(st - cfg.climax) * 2.5) : 0;

  // Con muchas bolitas se atenúan (si no, el centro se vuelve una mancha blanca)
  let nDentro = 0;
  for (let i = 0; i < e.n; i++) nDentro += 1 - e.FUERA[i];
  const densidad = Math.min(1, Math.max(0.3, Math.sqrt(220 / Math.max(1, nDentro))));

  // Bolitas
  for (let i = 0; i < e.n; i++) {
    const id = e.ID[i];
    const x = e.P[3 * i], y = e.P[3 * i + 1], z = e.P[3 * i + 2];
    const vx = e.V[3 * i], vy = e.V[3 * i + 1], vz = e.V[3 * i + 2];
    const ci = datos.colores[id];
    color.copy(ci < 0 ? BLANCO : PALETA[ci]);
    // Recién nacida: sale blanca del núcleo y toma su color
    const edad = st - (datos.nacen[id] ?? 0);
    if (ci >= 0 && edad < 0.35) color.lerp(BLANCO, 1 - edad / 0.35);
    // Destello cuando suena su golpe
    const ts = sonidosPorBolita.get(id);
    if (ts) {
      let fl = 0;
      for (let j = ts.length - 1; j >= 0; j--) {
        const a = st - ts[j];
        if (a < 0) continue;
        if (a > 0.3) break;
        fl = Math.max(fl, Math.exp(-a * 12));
      }
      color.multiplyScalar(1 + 1.4 * fl);
    }
    color.multiplyScalar(e.FUERA[i] ? 0.8 : 0.55 + 0.45 * densidad);
    v3.set(x, y, z);
    s3.setScalar(r);
    m4.compose(v3, q.identity(), s3);
    bolitas.setMatrixAt(i, m4);
    bolitas.setColorAt(i, color);

    // Estela hacia atrás, larga según la velocidad
    const sp = Math.hypot(vx, vy, vz);
    dir.set(-vx / sp, -vy / sp, -vz / sp);
    q.setFromUnitVectors(ARRIBA, dir);
    s3.set(r * 0.75, sp * 0.05, r * 0.75);
    m4.compose(v3, q, s3);
    estelas.setMatrixAt(i, m4);
    estelas.setColorAt(i, color.multiplyScalar(e.FUERA[i] ? 1 : densidad));
  }
  bolitas.count = estelas.count = e.n;
  bolitas.instanceMatrix.needsUpdate = estelas.instanceMatrix.needsUpdate = true;
  bolitas.instanceColor.needsUpdate = estelas.instanceColor.needsUpdate = true;

  // Esfera: hueco, ondas de los golpes que suenan y aro que se prende con los escapes
  const u = esfera.material.uniforms;
  u.t.value = st;
  u.hueco.value.fromArray(dirHueco(st, cfg));
  u.cosHueco.value = Math.cos(datos.angulos[Math.min(datos.angulos.length - 1, k)]);
  const ng = hasta(datos.golpes, st);
  for (let j = 0; j < MAX_ONDAS; j++) {
    const g = datos.golpes[ng - 1 - j];
    if (g) u.ondas.value[j].set(g[2] / R, g[3] / R, g[4] / R, g[0]);
    else u.ondas.value[j].set(0, 1, 0, -99);
  }
  const ne = hasta(tiemposEscape, st), ne0 = hasta(tiemposEscape, st - 0.25);
  u.borde.value = Math.min(1.0, (ne - ne0) * 0.1);
  u.latido.value = latido + climax;
  u.fuerza.value = 1 + 0.4 * climax;
  esfera.scale.setScalar(R * (1 + 0.012 * latido + 0.05 * climax));

  // Núcleo: brilla según cuántas bolitas nacen
  const nacidas = datos.totales[k] - (datos.totales[Math.max(0, k - 6)] ?? 0);
  const brillo = Math.min(1, nacidas / 20);
  nucleo.scale.setScalar(0.08 + 0.12 * brillo + 0.04 * latido);
  nucleo.material.color.setRGB(0.6 + 0.4 * brillo, 0.6 + 0.4 * brillo, 0.6 + 0.4 * brillo);
  luzNucleo.intensity = 3 + 12 * brillo + 15 * climax;

  piso.material.uniforms.avance.value = st * 0.6;
  piso.material.uniforms.latido.value = latido;
  bloom.strength = 0.45 + 0.12 * latido + 0.45 * climax;

  // Cámara: gira despacio y se acerca; en el clímax se aleja para ver la fuente de bolitas y tiembla
  const tc = Math.max(0, st - cfg.climax);
  const giro = 0.4 + st * 0.11 + tc * tc * 0.04;
  const dist = 14.6 - Math.min(st, cfg.climax) * 0.03 + 6 * (1 - Math.exp(-tc * 0.8)) - 0.25 * latido;
  const alto = 2.6 + Math.sin(st * 0.17) * 1.4 + 2.5 * (1 - Math.exp(-tc * 0.8));
  const temblor = 0.18 * climax;
  camara.position.set(Math.sin(giro) * dist + temblor * Math.sin(st * 91), alto + temblor * Math.sin(st * 77), Math.cos(giro) * dist);
  camara.lookAt(0, -0.55 - 1.0 * (1 - Math.exp(-tc * 0.8)), 0);

  // Capas 2D
  dibujarContador(datos.totales[k], latido);
  const kCierre = t >= cfg.cierre ? Math.min(1, (t - cfg.cierre) / 0.25) : 0;
  velo.material.uniforms.opacidad.value = kCierre;
  if (capaCierre) {
    capaCierre.material.uniforms.fuerza.value = kCierre;
    capaCierre.visible = kCierre > 0;
  }
  fundido.material.uniforms.opacidad.value = t < 0.3 ? 1 - t / 0.3 : 0;
  glitch.uniforms.fuerza.value = datos.glitch[f] ?? 0;
  glitch.uniforms.semilla.value = f;

  renderer.clear();
  compositor.render();
};

window.cargar = async (d) => {
  datos = d;
  cfg = d.cfg;
  for (const [ts, id] of d.golpes) {
    if (!sonidosPorBolita.has(id)) sonidosPorBolita.set(id, []);
    sonidosPorBolita.get(id).push(ts);
  }
  tiemposEscape = d.escapes;
  if (d.capas) await cargarCapas(d.capas);
};
window.listo = true;
</script>
